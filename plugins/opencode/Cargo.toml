[package]
name = "presencehub-opencode"
version = "0.1.0"
edition = "2021"
description = "PresenceHub OpenCode plugin"

[dependencies]
presencehub-core.path = "../../crates/core"
presencehub-plugin-host.path = "../../crates/plugin-host"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["tlhelp32", "handleapi", "minwinbase", "winnt"] }