[package]
name = "presencehub-league"
version = "0.1.0"
edition = "2021"
description = "PresenceHub League of Legends plugin (read-only LCU integration)"

[dependencies]
presencehub-core.path = "../../crates/core"
presencehub-plugin-host.path = "../../crates/plugin-host"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Approved additions for LCU access (Phase 3.2).
# reqwest: HTTPS GETs against the local LCU API.
# rustls + tokio-rustls: TLS with a loopback-only verifier (the LCU serves a
# self-signed certificate; verification is skipped ONLY for 127.0.0.1).
# tokio-tungstenite: WebSocket subscription for real-time gameflow events.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
# Used to drive the WebSocket stream's `next()` (already a transitive dep of
# tokio-tungstenite; no new compilation cost).
futures-util = "0.3"

# Process existence check for lockfile staleness detection.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "handleapi", "minwinbase", "winnt"] }

[dev-dependencies]
tracing-subscriber.workspace = true
