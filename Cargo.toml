[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/plugin-host",
    "crates/discord-output",
    "apps/desktop/src-tauri",
    "plugins/flstudio",
    "plugins/league",
    "plugins/opencode",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
ctrlc = "3"
