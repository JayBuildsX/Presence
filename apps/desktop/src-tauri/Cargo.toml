[package]
name = "presencehub-desktop"
version = "0.1.0"
edition = "2021"
description = "PresenceHub desktop application"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
presencehub-core.path = "../../../crates/core"
presencehub-plugin-host.path = "../../../crates/plugin-host"
presencehub-flstudio.path = "../../../plugins/flstudio"
presencehub-antigravity.path = "../../../plugins/antigravity"
presencehub-opencode.path = "../../../plugins/opencode"
presencehub-discord-output.path = "../../../crates/discord-output"
ctrlc.workspace = true
winapi = { version = "0.3", features = ["winuser", "errhandlingapi", "processthreadsapi", "handleapi", "winnt", "winbase", "minwindef"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
